<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="640" viewBox="0 0 1090 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>NexusReconfig block diagram</title>
  <defs>
    <marker id="a-clk" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker>
    <marker id="a-rst" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2e7d32"/></marker>
    <marker id="a-lmmi" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f5fa8"/></marker>
    <marker id="a-dat" viewBox="0 0 8 8" refX="8" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#444"/></marker>
  </defs>

  <rect x="0" y="0" width="1090" height="640" fill="#ffffff"/>

  <g transform="translate(40,0)">
    <!-- Title -->
    <text x="70" y="26" font-size="16" font-weight="bold" fill="#222">NexusReconfig: reconfiguration from internal logic (LFD2NX-40, CRUVI board)</text>

    <!-- Top level -->
    <rect x="70" y="40" width="810" height="540" rx="6" fill="#fbfbfb" stroke="#333" stroke-width="1.5"/>
    <text x="84" y="62" font-size="13" font-weight="bold" fill="#333">nexus_reconfig_top</text>

    <!-- osc0 -->
    <rect x="160" y="90" width="200" height="150" rx="4" fill="#fff4e0" stroke="#b7791f" stroke-width="1.5"/>
    <text x="260" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">osc0 (OSC IP 1.4.0)</text>
    <text x="260" y="129" font-size="10.5" text-anchor="middle" fill="#555">HF oscillator: 450 MHz / 18 = 25 MHz</text>
    <text x="168" y="154" font-size="11" fill="#333">hf_out_en_i = 1</text>
    <text x="168" y="189" font-size="11" fill="#333">lmmi_resetn_i</text>
    <text x="168" y="224" font-size="11" fill="#333">lmmi_clk_i</text>
    <text x="352" y="169" font-size="11" text-anchor="end" fill="#333">lmmi_clk_o</text>
    <text x="352" y="209" font-size="11" text-anchor="end" fill="#333">lmmi_resetn_o</text>
    <text x="300" y="234" font-size="11" text-anchor="middle" fill="#333">hf_clk_out_o</text>

    <!-- CONFIG_LMMI -->
    <rect x="620" y="90" width="200" height="186" rx="4" fill="#e8f0fb" stroke="#1f5fa8" stroke-width="1.5"/>
    <text x="720" y="112" font-size="13" font-weight="bold" text-anchor="middle" fill="#222">CONFIG_LMMI</text>
    <text x="720" y="129" font-size="10.5" text-anchor="middle" fill="#555">primitive, LMMI_EN = "EN"</text>
    <text x="628" y="169" font-size="11" fill="#333">LMMICLK</text>
    <text x="628" y="209" font-size="11" fill="#333">LMMIRESETN</text>
    <text x="720" y="234" font-size="10.5" text-anchor="middle" fill="#555">LSC_REFRESH reloads the</text>
    <text x="720" y="248" font-size="10.5" text-anchor="middle" fill="#555">bitstream from the SPI flash</text>
    <text x="720" y="268" font-size="10" text-anchor="middle" fill="#777">RSTSMCLK, SMCLK: hardware inferred</text>

    <!-- reconfig_core -->
    <rect x="160" y="320" width="680" height="240" rx="4" fill="#f0f0f0" stroke="#555" stroke-width="1.5"/>
    <text x="175" y="341" font-size="13" font-weight="bold" fill="#222">reconfig_core</text>

    <rect x="180" y="355" width="150" height="46" rx="3" fill="#fff" stroke="#777"/>
    <text x="255" y="374" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">power-on reset</text>
    <text x="255" y="391" font-size="10.5" text-anchor="middle" fill="#555">rst_n to all logic</text>

    <rect x="200" y="440" width="150" height="50" rx="3" fill="#fff" stroke="#777"/>
    <text x="275" y="461" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">sync + debounce</text>
    <text x="275" y="478" font-size="10.5" text-anchor="middle" fill="#555">20 ms, armed on release</text>

    <rect x="200" y="500" width="150" height="46" rx="3" fill="#fff" stroke="#777"/>
    <text x="275" y="519" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">auto-refresh timer</text>
    <text x="275" y="535" font-size="10.5" text-anchor="middle" fill="#555">AUTO_REFRESH_MS = 10 s</text>

    <rect x="410" y="430" width="140" height="116" rx="3" fill="#fff" stroke="#777"/>
    <text x="480" y="468" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">sequencer</text>
    <text x="480" y="487" font-size="10.5" text-anchor="middle" fill="#555">banner, wait,</text>
    <text x="480" y="502" font-size="10.5" text-anchor="middle" fill="#555">message, refresh</text>

    <rect x="600" y="355" width="220" height="50" rx="3" fill="#fff" stroke="#1f5fa8"/>
    <text x="710" y="375" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">lmmi_refresh</text>
    <text x="710" y="393" font-size="10.5" text-anchor="middle" fill="#555">16 ready cycles, then 79 00 00 00</text>

    <rect x="600" y="430" width="130" height="40" rx="3" fill="#fff" stroke="#777"/>
    <text x="665" y="448" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">uart_tx</text>
    <text x="665" y="463" font-size="10.5" text-anchor="middle" fill="#555">115200 8N1</text>

    <rect x="600" y="490" width="130" height="46" rx="3" fill="#fff" stroke="#777"/>
    <text x="665" y="509" font-size="12" font-weight="bold" text-anchor="middle" fill="#222">LED logic</text>
    <text x="665" y="525" font-size="10.5" text-anchor="middle" fill="#555">boot, heartbeat, fail</text>

    <!-- Clock nets -->
    <path d="M300,240 V318" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#a-clk)"/>
    <path d="M300,290 H140 V220 H158" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#a-clk)"/>
    <circle cx="300" cy="290" r="3.5" fill="#c0392b"/>
    <text x="308" y="279" font-size="11" fill="#c0392b">sys_clk (25 MHz)</text>
    <path d="M360,165 H618" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#a-clk)"/>
    <text x="490" y="159" font-size="11" text-anchor="middle" fill="#c0392b">lmmi_clk (pass-through)</text>

    <!-- Reset nets -->
    <path d="M180,378 H110 V185 H158" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#a-rst)"/>
    <text x="116" y="340" font-size="11" fill="#2e7d32">rst_n</text>
    <path d="M360,205 H618" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#a-rst)"/>
    <text x="490" y="199" font-size="11" text-anchor="middle" fill="#2e7d32">lmmi_resetn (pass-through)</text>

    <!-- LMMI port -->
    <path d="M650,355 V278" fill="none" stroke="#1f5fa8" stroke-width="3.5" marker-end="url(#a-lmmi)"/>
    <text x="642" y="294" font-size="11" text-anchor="end" fill="#1f5fa8">LMMIREQUEST, LMMIWRRD_N,</text>
    <text x="642" y="309" font-size="11" text-anchor="end" fill="#1f5fa8">LMMIOFFSET = 0x01, LMMIWDATA[7:0]</text>
    <path d="M790,276 V353" fill="none" stroke="#1f5fa8" stroke-width="2" marker-end="url(#a-lmmi)"/>
    <text x="796" y="302" font-size="11" fill="#1f5fa8">LMMIREADY</text>

    <!-- Data and control -->
    <rect x="67" y="462" width="6" height="6" fill="#333"/>
    <text x="60" y="469" font-size="12" font-weight="bold" text-anchor="end" fill="#222">btn_ni (B2)</text>
    <path d="M73,465 H198" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a-dat)"/>

    <path d="M350,465 H408" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a-dat)"/>
    <text x="380" y="458" font-size="10.5" text-anchor="middle" fill="#444">btn_event</text>
    <path d="M350,523 H408" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a-dat)"/>
    <text x="380" y="516" font-size="10.5" text-anchor="middle" fill="#444">auto_event</text>

    <path d="M480,430 V380 H598" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a-dat)"/>
    <text x="540" y="373" font-size="10.5" text-anchor="middle" fill="#444">start</text>
    <path d="M550,450 H598" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a-dat)"/>
    <text x="575" y="444" font-size="10.5" text-anchor="middle" fill="#444">bytes</text>
    <path d="M550,513 H598" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a-dat)"/>
    <text x="575" y="507" font-size="10.5" text-anchor="middle" fill="#444">state</text>

    <path d="M730,450 H877" fill="none" stroke="#444" stroke-width="1.5" marker-end="url(#a-dat)"/>
    <rect x="877" y="447" width="6" height="6" fill="#333"/>
    <text x="890" y="454" font-size="12" font-weight="bold" fill="#222">txd_o (F11)</text>
    <path d="M730,513 H877" fill="none" stroke="#444" stroke-width="2.5" marker-end="url(#a-dat)"/>
    <rect x="877" y="510" width="6" height="6" fill="#333"/>
    <text x="890" y="517" font-size="12" font-weight="bold" fill="#222">led_o[1:0] (A8, B8)</text>

    <!-- Legend -->
    <g font-size="11" fill="#333">
      <line x1="70" y1="610" x2="100" y2="610" stroke="#c0392b" stroke-width="2"/><text x="106" y="614">clock</text>
      <line x1="160" y1="610" x2="190" y2="610" stroke="#2e7d32" stroke-width="2"/><text x="196" y="614">reset</text>
      <line x1="250" y1="610" x2="280" y2="610" stroke="#1f5fa8" stroke-width="3"/><text x="286" y="614">LMMI interface</text>
      <line x1="390" y1="610" x2="420" y2="610" stroke="#444" stroke-width="1.5"/><text x="426" y="614">data / control</text>
      <rect x="527" y="607" width="6" height="6" fill="#333"/><text x="540" y="614">device pin</text>
    </g>
  </g>
</svg>
